<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/health-os-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Health OS design system: tokens, components, widgets and imagery, documented for AI agents and people." />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Theme: light (default, no class) or paper (.theme-paper). Applied before paint. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'paper') document.documentElement.classList.add('theme-paper');
        } catch (e) {}
      })();
    </script>

    <!-- Spline Sans (display) and Anonymous Pro (body and labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;600;700&family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet" />

    <title>Health OS Design System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
